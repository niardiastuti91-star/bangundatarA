        body {

            background: linear-gradient(135deg, #38BDF8 0%, #818CF8 50%, #F472B6 100%);

            user-select: none;
            -webkit-tap-highlight-color: transparent;

        /* Gaya Tombol 3D ala Game Anak */
        .btn-3d {
            transition: transform 0.1s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.1s ease;
            box-shadow: 0 8px 0 rgba(0, 0, 0, 0.2);
        }
        .btn-3d:active:not(:disabled) {
            transform: translateY(6px);
            box-shadow: 0 2px 0 rgba(0, 0, 0, 0.2);
        }

        /* Animasi Membal (Bounce) */
        @keyframes popIn {
            0% { transform: scale(0.5); opacity: 0; }
            70% { transform: scale(1.08); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }
        .animate-pop {
            animation: popIn 0.45s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        /* Animasi Goyang Lembut saat Jawaban Salah */
        @keyframes gentleShake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            50% { transform: translateX(10px); }
            75% { transform: translateX(-6px); }
        }
        .animate-shake {
            animation: gentleShake 0.4s ease-in-out;
        }

        /* Animasi Mengambang untuk Karakter/Objek */
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
        }
        .animate-float {
            animation: float 3s ease-in-out infinite;
        }

        /* Canvas Konfeti di Lapisan Atas */
        #confetti-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 50;
        }
    </style>
</head>

        let gameQuestions = [];

        /**
         * =================================================================
         * 3. SISTEM AUDIO & SUARA (WEB AUDIO API + WEB SPEECH API)
         * =================================================================
         */
        // Inisialisasi Web Audio Context saat interaksi pertama
        function initAudio() {
            if (!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContext();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        // Efek Suara Ceria saat Jawaban Benar (Arpeggio Nada Tinggi)
        function playSuccessSound() {
            try {
                initAudio();
                const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
                notes.forEach((freq, idx) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, audioCtx.currentTime + idx * 0.08);
                    
                    gain.gain.setValueAtTime(0.25, audioCtx.currentTime + idx * 0.08);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + idx * 0.08 + 0.35);
                    
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    
                    osc.start(audioCtx.currentTime + idx * 0.08);
                    osc.stop(audioCtx.currentTime + idx * 0.08 + 0.35);
                });
            } catch (e) {
                console.warn('Audio tidak didukung:', e);
            }
        }

                osc.frequency.setValueAtTime(340, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(240, audioCtx.currentTime + 0.3);
                
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
                
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                
                osc.start();
                osc.stop(audioCtx.currentTime + 0.3);
            } catch (e) {
                console.warn('Audio tidak didukung:', e);
            }
        }

        // Efek Suara Fanfare Kemenangan Akhir
        function playVictorySound() {
            try {
                initAudio();
                const melody = [
                    { f: 523.25, t: 0, d: 0.15 },
                    { f: 523.25, t: 0.16, d: 0.15 },
                    { f: 523.25, t: 0.32, d: 0.15 },
                    { f: 659.25, t: 0.48, d: 0.4 },
                    { f: 587.33, t: 0.9, d: 0.2 },
                    { f: 659.25, t: 1.12, d: 0.2 },
                    { f: 783.99, t: 1.35, d: 0.6 }
                ];
                melody.forEach(n => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(n.f, audioCtx.currentTime + n.t);
                    gain.gain.setValueAtTime(0.25, audioCtx.currentTime + n.t);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + n.t + n.d);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(audioCtx.currentTime + n.t);
                    osc.stop(audioCtx.currentTime + n.t + n.d);
                });
            } catch (e) {}
        }

        // Narasi Suara Bahasa Indonesia (Web Speech API)
        function speakIndonesian(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); // Hentikan suara sebelumnya agar tidak bertumpuk
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'id-ID';
                utterance.rate = 0.92; // Sedikit lebih lambat agar jelas untuk anak kelas 1 SD
                utterance.pitch = 1.15; // Nada sedikit lebih ceria
                window.speechSynthesis.speak(utterance);
            }
        }

        function speakCurrentQuestion() {
            if (gameQuestions[currentIndex]) {
                speakIndonesian(gameQuestions[currentIndex].voiceText);
            }
        }

        /**
         * =================================================================
         * 4. LOGIKA PERMAINAN & PEMBUATAN 10 SOAL ACAK
         * =================================================================
         */
        function shuffleArray(array) {
            const arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        // Menyusun 10 soal acak yang seimbang antara Tebak Bentuk dan Benda Sekitar
        function generateTenQuestions() {
            const q1Pool = shuffleArray(TYPE1_QUESTIONS);
            const q2Pool = shuffleArray(TYPE2_QUESTIONS);
            
            // Ambil 4 soal dari Tipe 1 dan 6 soal dari Tipe 2 = 10 Soal
            const selected = [
                ...q1Pool.slice(0, 4),
                ...q2Pool.slice(0, 6)
            ];
            return shuffleArray(selected);
        }

        // Membuat 3 pilihan tombol (1 benar + 2 pengecoh acak)
        function generateOptions(correctAnswer) {
            const wrongShapes = shuffleArray(SHAPES.filter(s => s !== correctAnswer));
            const options = [correctAnswer, wrongShapes[0], wrongShapes[1]];
            return shuffleArray(options);
        }

        // Memulai / Mengulang Permainan
        function startGame() {
            initAudio();
            stopConfetti();
            gameQuestions = generateTenQuestions();
            currentIndex = 0;
            isTransitioning = false;

            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('victory-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.remove('hidden');
            document.getElementById('game-screen').classList.add('flex');

            renderStarsBar();
            loadQuestion();
        }

        // Render Bar 10 Bintang di bagian atas
        function renderStarsBar() {
            const starsBar = document.getElementById('stars-bar');
            starsBar.innerHTML = '';
            for (let i = 0; i < 10; i++) {
                const isEarned = i < currentIndex;
                const starSpan = document.createElement('div');
                starSpan.className = `flex items-center justify-center text-lg sm:text-2xl transition-transform duration-300 ${isEarned ? 'scale-110' : 'opacity-30 grayscale'}`;
                starSpan.textContent = '⭐';
                starsBar.appendChild(starSpan);
            }
            document.getElementById('question-number').textContent = Math.min(currentIndex + 1, 10);
            document.getElementById('star-count').textContent = currentIndex;
        }

        // Menampilkan Soal ke Layar
        function loadQuestion() {
            isTransitioning = false;
            const q = gameQuestions[currentIndex];

            // Reset kotak umpan balik
            const feedbackText = document.getElementById('feedback-text');
            feedbackText.classList.add('opacity-0');

            // Tampilkan teks soal
            document.getElementById('question-text').textContent = q.questionText;

            // Tampilkan ilustrasi SVG dengan animasi pop
            const illustrationBox = document.getElementById('shape-illustration');
            illustrationBox.classList.remove('animate-pop');
            void illustrationBox.offsetWidth; // Trigger reflow untuk mengulang animasi
            illustrationBox.innerHTML = q.svg;
            illustrationBox.classList.add('animate-pop');

            // Tampilkan label benda jika soal tipe benda sekitar
            const itemLabel = document.getElementById('item-label');
            if (q.label) {
                itemLabel.textContent = q.label;
                itemLabel.classList.remove('hidden');
            } else {
                itemLabel.classList.add('hidden');
            }

            // Render 3 tombol pilihan besar dengan warna ceria
            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';
            const options = generateOptions(q.answer);

            const buttonThemes = [
                'bg-sky-500 hover:bg-sky-400 border-sky-700 text-white',
                'bg-purple-500 hover:bg-purple-400 border-purple-700 text-white',
                'bg-rose-500 hover:bg-rose-400 border-rose-700 text-white'
            ];

            options.forEach((optText, idx) => {
                const btn = document.createElement('button');
                btn.className = `btn-3d ${buttonThemes[idx]} text-xl sm:text-2xl font-bold py-4 sm:py-5 px-4 rounded-2xl border-4 cursor-pointer flex items-center justify-center text-center leading-tight`;
                btn.textContent = optText;
                btn.onclick = () => checkAnswer(optText, btn);
                optionsContainer.appendChild(btn);
            });

            // Bacakan soal secara otomatis
            setTimeout(() => {
                speakCurrentQuestion();
            }, 250);
        }

        // Memeriksa Jawaban Anak
        function checkAnswer(selectedAnswer, btnElement) {
            if (isTransitioning) return;

            const currentQuestion = gameQuestions[currentIndex];
            const feedbackText = document.getElementById('feedback-text');

            if (selectedAnswer === currentQuestion.answer) {
                // JAWABAN BENAR!
                isTransitioning = true;
                playSuccessSound();
                triggerMiniConfetti();

                // Ubah gaya tombol yang dipilih menjadi hijau cerah
                btnElement.className = 'btn-3d bg-emerald-500 border-emerald-700 text-white text-xl sm:text-2xl font-bold py-4 sm:py-5 px-4 rounded-2xl border-4 flex items-center justify-center text-center leading-tight scale-105';
                btnElement.innerHTML = `✅ ${selectedAnswer}`;

                const praises = ['Hebat!', 'Pintar!', 'Bagus Sekali!', 'Betul!'];
                const chosenPraise = praises[Math.floor(Math.random() * praises.length)];

                feedbackText.textContent = `🌟 ${chosenPraise} Itu ${currentQuestion.answer}!`;
                feedbackText.className = 'text-xl sm:text-2xl font-bold text-center text-emerald-600 opacity-100 animate-pop';

                speakIndonesian(`${chosenPraise} Itu adalah ${currentQuestion.answer}.`);

                currentIndex++;
                renderStarsBar();

                // Lanjut ke soal berikutnya atau layar kemenangan setelah 1.8 detik
                setTimeout(() => {
                    if (currentIndex < 10) {
                        loadQuestion();
                    } else {
                        showVictoryScreen();
                    }
                }, 1900);

            } else {
                // JAWABAN SALAH (Respons Lembut & Coba Lagi)
                playGentleTryAgainSound();

                // Animasi goyang lembut pada tombol yang salah dan nonaktifkan sementara tombol tersebut
                btnElement.classList.add('animate-shake', 'opacity-50');
                btnElement.disabled = true;

                feedbackText.textContent = '😊 Coba lagi ya, kamu pasti bisa!';
                feedbackText.className = 'text-xl sm:text-2xl font-bold text-center text-amber-600 opacity-100';

                speakIndonesian('Coba lagi ya!');
            }
        }

        // Menampilkan Layar Perayaan Akhir
        function showVictoryScreen() {
            document.getElementById('game-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.remove('flex');
            document.getElementById('victory-screen').classList.remove('hidden');
            document.getElementById('victory-screen').classList.add('flex');

            const victoryStars = document.getElementById('victory-stars');
            victoryStars.innerHTML = '';
            for (let i = 0; i < 10; i++) {
                const s = document.createElement('span');
                s.textContent = '⭐';
                s.style.animationDelay = `${i * 0.08}s`;
                s.className = 'inline-block animate-bounce';
                victoryStars.appendChild(s);
            }

            playVictorySound();
            startContinuousConfetti();
            speakIndonesian('Luar biasa! Kamu hebat sekali, semua bintang berhasil dikumpulkan!');
        }

        /**
         * =================================================================
         * 5. SISTEM ANIMASI KONFETI (CANVAS)
         * =================================================================
         */
        const canvas = document.getElementById('confetti-canvas');
        const ctx = canvas.getContext('2d');
        let confettiParticles = [];
        let confettiAnimationId = null;
        let isContinuousConfetti = false;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        const confettiColors = ['#EF4444', '#F59E0B', '#10B981', '#3B82F6', '#EC4899', '#8B5CF6'];

        function createParticles(count, fromTop = false) {
            for (let i = 0; i < count; i++) {
                confettiParticles.push({
                    x: fromTop ? Math.random() * canvas.width : canvas.width / 2 + (Math.random() - 0.5) * 200,
                    y: fromTop ? -20 : canvas.height / 2,
                    vx: (Math.random() - 0.5) * (fromTop ? 4 : 14),
                    vy: fromTop ? Math.random() * 4 + 2 : (Math.random() - 1) * 12 - 3,
                    size: Math.random() * 10 + 6,
                    color: confettiColors[Math.floor(Math.random() * confettiColors.length)],
                    rotation: Math.random() * 360,
                    vRot: (Math.random() - 0.5) * 10
                });
            }
        }

        function triggerMiniConfetti() {
            createParticles(45, false);
            if (!confettiAnimationId) animateConfetti();
        }

        function startContinuousConfetti() {
            isContinuousConfetti = true;
            createParticles(80, true);
            if (!confettiAnimationId) animateConfetti();
        }

        function stopConfetti() {
            isContinuousConfetti = false;
            confettiParticles = [];
            if (confettiAnimationId) {
                cancelAnimationFrame(confettiAnimationId);
                confettiAnimationId = null;
            }
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }

        function animateConfetti() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (isContinuousConfetti && confettiParticles.length < 100) {
                createParticles(4, true);
            }

            for (let i = confettiParticles.length - 1; i >= 0; i--) {
                const p = confettiParticles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.25; // Gravitasi
                p.rotation += p.vRot;

                ctx.save();
                ctx.translate(p.x, p.y);
                ctx.rotate((p.rotation * Math.PI) / 180);
                ctx.fillStyle = p.color;
                ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.6);
                ctx.restore();

                if (p.y > canvas.height + 30) {
                    confettiParticles.splice(i, 1);
                }
            }

            if (confettiParticles.length > 0 || isContinuousConfetti) {
                confettiAnimationId = requestAnimationFrame(animateConfetti);
            } else {
                confettiAnimationId = null;
            }
        }
    </script>
